<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1712" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MT Clinic">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>MT Clinic</title>
<script src="config.js"></script>
<style>
:root{
  /* MT Clinic brand: deep green, mid green, pale mint */
  --bg:#eaf3ee;--card:#fff;--ink:#1d2a23;--muted:#5f6e66;--line:#d4e3d9;--soft:#e0eee5;
  --brand:#124a33;--accent:#1f7a4f;--accent-ink:#fff;--sum:#124a33;--sum-ink:#fff;
  --up:#a3520a;--up-bg:#fcefdf;
  --danger:#c93b3b;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --nav-h:60px;--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1712;--card:#13221b;--ink:#e4efe8;--muted:#93a89c;--line:#22362b;--soft:#1a2d23;
  --brand:#9edbb9;--accent:#4cb985;--accent-ink:#06130c;--sum:#1f7a4f;--sum-ink:#fff;
  --up:#f2b46a;--up-bg:#2e2213;--danger:#ff7676;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;flex:none}
.brand-t{min-width:0}
.b1{font:700 22px/1.05 Georgia,"Times New Roman",serif;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b2{font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;color:var(--muted);margin:2px 4px 12px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:44px;min-width:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);font-size:14px}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=search],input[type=number],input[type=text],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;outline:none;font-size:16px;-webkit-appearance:none;appearance:none}
textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
.controls{padding-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:0 16px;height:44px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{padding:14px 0 calc(var(--nav-h) + var(--safe-b) + 24px)}
main.has-sum{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 96px)}
.banner{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);margin-bottom:12px}
.banner.err{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.banner code{font-size:13px}
.group{margin-bottom:18px}
.name,.meta{unicode-bidi:plaintext;text-align:left}
.group h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 6px 4px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:1fr auto 44px;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font-weight:600;line-height:1.3}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.price{text-align:right}
.now{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--muted);white-space:nowrap}
.add{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;color:var(--accent);display:flex;align-items:center;justify-content:center}
.add.in{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:14px;font-weight:700}
.add:active{transform:scale(.92)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* quote */
.qfields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.qfields .full{grid-column:1/-1}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px 4px}
.qline{padding:12px 14px;border-top:1px solid var(--line)}
.qline:first-child{border-top:0}
.qtop{display:flex;gap:10px;align-items:flex-start}
.qtop .info{flex:1;min-width:0}
.rm{border:0;background:transparent;color:var(--muted);width:44px;height:44px;margin:-10px -12px 0 0;font-size:22px;flex:none}
.qbot{display:flex;align-items:center;gap:10px;margin-top:10px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:46px;flex:none}
.qty button{border:0;background:var(--soft);width:44px;height:100%;font-size:20px}
.qty input{border:0;border-radius:0;height:100%;text-align:center;padding:0;width:46px;background:var(--card);font-weight:700}
.unit{flex:1;min-width:0}
.unit input{height:46px;text-align:right;padding-right:12px}
.src{vertical-align:1px;margin:0 0 0 6px}
.src.man{background:var(--up-bg);color:var(--up)}
.ltot{min-width:84px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.totals{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:12px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.totals .grand{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:700;font-size:19px;color:var(--ink)}
.totals .poa{font-size:13px;color:var(--up)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:48px;padding:0 14px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:active{opacity:.75}

/* sticky quote summary */
.sum{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));z-index:15;padding:8px 16px;pointer-events:none}
.sum-in{max-width:728px;margin:0 auto;background:var(--sum);color:var(--sum-ink);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;pointer-events:auto;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.sum-in .t{flex:1;min-width:0}
.sum-in .t small{display:block;font-size:12px;opacity:.7}
.sum-in .t b{font-size:18px;font-variant-numeric:tabular-nums}
.sum-in button{border:0;background:#fff;color:#124a33;height:44px;border-radius:10px;padding:0 16px;font-weight:700}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);height:var(--nav-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:var(--accent)}
.count{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center}
.count:empty{display:none}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 88px);transform:translateX(-50%);background:var(--brand);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.show{opacity:1}
#printArea{display:none}

@media print{
  @page{margin:16mm}
  :root{color-scheme:light}
  body{background:#fff;color:#111;font-size:11pt}
  header.top,#main,.toast,nav.bottom,.sum{display:none!important}
  #printArea{display:block}
  .p-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1f7a4f;padding-bottom:12px;margin-bottom:14px}
  .p-brand{display:flex;align-items:center;gap:12px}
  .p-brand .logo{width:54px;height:54px}
  .p-brand .b1{font-size:24pt;color:#124a33}
  .p-brand .b2{font-size:8pt;color:#1f7a4f}
  .p-title{font:700 16pt Georgia,serif;color:#124a33;margin:0 0 10px}
  .p-meta{text-align:right;font-size:10pt;line-height:1.6}
  .p-to{margin-bottom:14px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th{text-align:left;font-size:9pt;text-transform:uppercase;letter-spacing:.04em;color:#124a33;border-bottom:1px solid #124a33;padding:6px 4px}
  #printArea td{padding:7px 4px;border-bottom:1px solid #ddd;vertical-align:top}
  #printArea .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .p-tot{margin:12px 0 0 auto;width:260px}
  .p-tot div{display:flex;justify-content:space-between;padding:3px 0}
  .p-tot .g{color:#124a33;border-top:2px solid #1f7a4f;font-weight:700;font-size:13pt;padding-top:6px;margin-top:4px}
  .p-notes{margin-top:20px;font-size:10pt;white-space:pre-wrap}
  .p-foot{margin-top:30px;padding-top:10px;border-top:1px solid #cfe0d5;font-size:9pt;color:#555;line-height:1.6}
  .p-foot b{color:#124a33}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#1f7a4f"/><path d="M26 15h12v11h11v12H38v11H26V38H15V26h11z" fill="#fff"/></svg><div class="brand-t"><div class="b1" id="brand">MT Clinic</div><div class="b2" id="brand2">Nursing Care</div></div></div>
    <a class="iconbtn" id="openSheet" target="_blank" rel="noopener" hidden aria-label="Open price sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>
    </a>
    <button class="iconbtn" id="refresh" aria-label="Reload prices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
  <div class="controls" id="filters">
    <input id="search" type="search" placeholder="Search procedures" autocomplete="off" enterkeyhint="search" aria-label="Search">
  </div>
  <div class="chips" id="chips"></div>
</div></header>

<main class="wrap" id="main"></main>
<div class="sum" id="sum" hidden></div>

<nav class="bottom"><div class="in" role="tablist">
  <button class="tab" data-view="list" role="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Prices</button>
  <button class="tab" data-view="quote" role="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h5"/></svg>Quote<span class="count" id="qcount"></span></button>
</div></nav>

<div id="printArea"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";

/* ---------- config ---------- */
const USER = window.PRICING_CONFIG || {};
const CFG = Object.assign({sheetId:"", title:"MT Clinic", subtitle:"", companyName:"", contactName:"", phone:"", instagram:"", locale:"en-GB", vatPct:0, quoteValidityDays:30}, USER);
CFG.currency = String(USER.currency || USER.defaultCurrency || "GBP").toUpperCase();
CFG.tab = USER.tab || (USER.tabs && USER.tabs.procedures) || "Procedures";
const pageUrl = new URL(location.href);
if (pageUrl.searchParams.get("sheet")) CFG.sheetId = pageUrl.searchParams.get("sheet").trim();
const NS = "pricing:" + CFG.sheetId + ":";
const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Accepts "£1,250.00", "1250", "€ 99" etc.
const num = v => { let s = String(v ?? "").trim(); if (!s) return null; s = s.replace(/[^0-9.\-]/g, ""); if (!s || s === "-" || s === ".") return null; const n = parseFloat(s); return isNaN(n) ? null : n; };
const truthy = v => !/^(false|no|n|0|inactive)$/i.test(String(v ?? "").trim());
const r2 = n => Math.round(n * 100) / 100;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fmtDate = d => d.toLocaleDateString(CFG.locale, {day:"numeric", month:"short", year:"numeric"});
const fmtTime = t => new Date(t).toLocaleTimeString(CFG.locale, {hour:"2-digit", minute:"2-digit"});
let fmt;
function money(n) {
  if (n == null || isNaN(n)) return "POA";
  try { return (fmt ||= new Intl.NumberFormat(CFG.locale, {style:"currency", currency:CFG.currency})).format(n); }
  catch (e) { return CFG.currency + " " + n.toFixed(2); }
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600); }
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

/* ---------- CSV ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function table(rows) {
  const headers = (rows.shift() || []).map(h => h.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""));
  const out = rows.filter(r => r.some(v => v.trim() !== "")).map(r => Object.fromEntries(headers.map((k, i) => [k, (r[i] ?? "").trim()])));
  return {headers, rows: out};
}
const pick = (o, ...ks) => { for (const k of ks) if (o[k] !== undefined && o[k] !== "") return o[k]; return ""; };
const has = (t, ...ks) => ks.some(k => t.headers.includes(k));

/* ---------- data ---------- */
const COLS = "code, name, category, unit, price, notes, active";
function normalise(t) {
  // gviz returns the FIRST tab when the tab name is wrong, so check the headers are ours.
  if (!t.headers.some(Boolean))
    throw new Error(`Tab “${CFG.tab}” is empty or missing. Check the tab name matches config.js → tab.`);
  const missing = [];
  if (!has(t, "code", "name", "procedure")) missing.push("name");
  if (!has(t, "price", "base_price", "list_price")) missing.push("price");
  if (missing.length)
    throw new Error(`Tab “${CFG.tab}” wasn’t found or has the wrong headers (missing ${missing.join(" and ")}). Check the tab is named “${CFG.tab}” and row 1 reads: ${COLS}.`);
  const procedures = t.rows.map(o => ({
    code: pick(o, "code", "procedure_code"),
    name: pick(o, "name", "procedure", "procedure_name"),
    cat: pick(o, "category", "group") || "Other",
    unit: pick(o, "unit"),
    price: num(pick(o, "price", "base_price", "list_price")),
    desc: pick(o, "notes", "description"),
    active: truthy(pick(o, "active"))
  })).filter(p => (p.code || p.name) && p.active);
  procedures.forEach(p => { if (!p.code) p.code = p.name; if (!p.name) p.name = p.code; });
  return procedures;
}

/* ---------- state ---------- */
const state = {
  procedures: [], cats: [], search: "", cat: "",
  view: store.get("view", "list") === "quote" ? "quote" : "list",
  quote: Object.assign({lines: [], vat: null, notes: "", ref: "", for: ""}, store.get("quote", {})),
  syncedAt: null, lastTry: 0, loaded: false, error: "", loading: false
};
if (state.quote.vat == null) state.quote.vat = CFG.vatPct;
const procBy = code => state.procedures.find(p => p.code === code);
const saveQuote = () => store.set("quote", state.quote);
const qCount = () => state.quote.lines.reduce((a, l) => a + l.qty, 0);

/* ---------- loading (always live from the sheet; nothing is shown if it can't be read) ---------- */
async function fetchTab(name) {
  const u = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(CFG.sheetId)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  let res;
  // A private sheet redirects to a Google sign-in page, which the browser blocks (CORS) → fetch throws.
  try { res = await fetch(u, {cache: "no-store"}); }
  catch (e) {
    throw new Error(navigator.onLine === false ? "You’re offline. Prices will load when you’re back online."
      : "Couldn’t load the Google Sheet. Check your connection, and that the sheet is shared “Anyone with the link → Viewer”.");
  }
  const text = await res.text();
  if (res.status === 404) throw new Error("Google Sheet not found. Check sheetId in config.js is the long ID from the sheet’s URL.");
  if (res.status === 401 || res.status === 403 || /^\s*</.test(text)) throw new Error("The Google Sheet isn’t shared publicly. In the sheet: Share → General access → “Anyone with the link” → Viewer.");
  if (!res.ok) throw new Error(`Google returned an error (HTTP ${res.status}). Try again shortly.`);
  return table(parseCSV(text));
}

function clearData() {
  Object.assign(state, {procedures: [], cats: [], loaded: false, syncedAt: null});
  renderChips();
}

async function load() {
  if (!CFG.sheetId) { state.error = "No Google Sheet connected. Put your sheet ID in config.js → sheetId."; clearData(); updateSync(); render(); return; }
  state.loading = true; state.lastTry = Date.now(); updateSync(); render();
  try {
    const procedures = normalise(await fetchTab(CFG.tab));
    Object.assign(state, {procedures, loaded: true, syncedAt: Date.now(), error: ""});
    state.cats = [...new Set(procedures.map(p => p.cat))];
    if (state.cat && !state.cats.includes(state.cat)) state.cat = "";
    renderChips();
  } catch (e) {
    state.error = e.message; clearData();
  } finally {
    state.loading = false; updateSync(); render();
  }
}

// Sync status lives above the list (not in the header) so the clinic name always fits.
const syncText = () => state.loading ? "Syncing…" : state.syncedAt ? `Synced ${fmtTime(state.syncedAt)} · ${state.procedures.length} procedure${state.procedures.length === 1 ? "" : "s"}` : "";
function updateSync() {
  $("#refresh").classList.toggle("spin", state.loading);
  const el = $("#sync"); if (el) el.textContent = syncText();
}

/* ---------- rendering ---------- */
function renderChips() {
  $("#chips").innerHTML = [["", "All"], ...state.cats.map(c => [c, c])]
    .map(([v, l]) => `<button class="chip" data-cat="${esc(v)}" aria-pressed="${state.cat === v}">${esc(l)}</button>`).join("");
}

function filtered() {
  const terms = state.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return state.procedures.filter(p => (!state.cat || p.cat === state.cat) &&
    terms.every(t => (p.name + " " + p.code + " " + p.cat + " " + p.desc).toLowerCase().includes(t)));
}

function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.view === state.view));
  $("#qcount").textContent = state.loaded && qCount() || "";
  const showFilters = state.view === "list" && state.loaded;
  $("#chips").hidden = !showFilters || state.cats.length < 2; $("#filters").hidden = !showFilters;
  let h = state.error ? `<div class="banner err">${esc(state.error)}</div>` : "";
  if (!state.loaded) { $("#main").innerHTML = h + (state.loading ? `<div class="empty">Loading prices…</div>` : ""); renderSum(); return; }
  h += state.view === "quote" ? viewQuote() : viewList();
  $("#main").innerHTML = h;
  renderSum();
}

function viewList() {
  const items = filtered();
  if (!items.length) return state.procedures.length ? `<div class="empty"><b>No procedures found</b>Try a different search or category.</div>`
    : `<div class="empty"><b>The price list is empty</b>Add rows to the “${esc(CFG.tab)}” tab.</div>`;
  const groups = {};
  items.forEach(p => (groups[p.cat] ||= []).push(p));
  return `<div class="sync" id="sync">${esc(syncText())}</div>` + Object.entries(groups).map(([cat, ps]) => `<section class="group"><h3 dir="auto">${esc(cat)}</h3><div class="list">` +
    ps.map(p => {
      const inQ = state.quote.lines.find(l => l.code === p.code);
      return `<div class="row">
        <div><div class="name" dir="auto">${esc(p.name)}</div><div class="meta" dir="auto">${esc(p.code)}${p.unit ? " · per " + esc(p.unit) : ""}${p.desc ? " · " + esc(p.desc) : ""}</div></div>
        <div class="price"><div class="now">${money(p.price)}</div></div>
        <button class="add${inQ ? " in" : ""}" data-add="${esc(p.code)}" aria-label="Add ${esc(p.name)} to quote">${inQ ? "×" + inQ.qty : "+"}</button>
      </div>`;
    }).join("") + `</div></section>`).join("");
}

function computeQuote() {
  const lines = state.quote.lines.map(l => {
    const p = procBy(l.code);
    const list = p ? p.price : null;
    const unit = l.override != null ? l.override : list;
    return {l, p, list, unit, total: unit == null ? null : r2(unit * l.qty)};
  });
  const sub = r2(lines.reduce((a, x) => a + (x.total || 0), 0));
  const vatPct = num(state.quote.vat) || 0;
  const vat = r2(sub * vatPct / 100);
  return {lines, sub, vatPct, vat, total: r2(sub + vat), poa: lines.some(x => x.unit == null)};
}
const basis = x => x.l.override != null ? "Manual" : x.unit == null ? "POA" : "";
const autoRef = () => { const d = new Date(); return "Q-" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0"); };
const validUntil = () => { const d = today(); d.setDate(d.getDate() + (+CFG.quoteValidityDays || 30)); return d; };

function viewQuote() {
  const q = computeQuote();
  if (!q.lines.length) return `<div class="empty"><b>No items yet</b>Tap + on the Prices tab to add procedures.</div>`;
  return `
  <div class="list">${q.lines.map(x => `
    <div class="qline" data-line="${esc(x.l.code)}">
      <div class="qtop"><div class="info"><div class="name" dir="auto">${esc(x.p ? x.p.name : x.l.code)}</div>
        <div class="meta">${esc(x.l.code)}${x.p && x.p.unit ? " · per " + esc(x.p.unit) : ""}${x.p ? "" : " · no longer in price list"}<span class="badge src${x.l.override != null ? " man" : ""}"${basis(x) ? "" : " hidden"}>${basis(x)}</span></div></div>
        <button class="rm" data-rm="${esc(x.l.code)}" aria-label="Remove">×</button></div>
      <div class="qbot">
        <div class="qty"><button data-dec="${esc(x.l.code)}" aria-label="Less">−</button><input type="number" inputmode="numeric" min="1" data-qty="${esc(x.l.code)}" value="${x.l.qty}" aria-label="Quantity"><button data-inc="${esc(x.l.code)}" aria-label="More">+</button></div>
        <div class="unit">
          <input type="number" inputmode="decimal" step="0.01" data-ov="${esc(x.l.code)}" value="${x.l.override ?? ""}" placeholder="${x.list == null ? "Price" : x.list.toFixed(2)}" aria-label="Unit price"></div>
        <div class="ltot" data-ltot="${esc(x.l.code)}">${money(x.total)}</div>
      </div>
    </div>`).join("")}</div>
  <div class="totals">
    <div><span>Subtotal</span><span id="t-sub">${money(q.sub)}</span></div>
    <div id="t-vrow"${q.vatPct ? "" : " hidden"}><span>VAT <span id="t-vp">${q.vatPct}</span>%</span><span id="t-vat">${money(q.vat)}</span></div>
    <div class="grand"><span>Total</span><span id="t-tot">${money(q.total)}</span></div>
    <div class="poa" id="t-poa"${q.poa ? "" : " hidden"}>Excludes POA items — type a unit price to include them.</div>
  </div>
  <div class="actions">
    <button class="btn primary" data-act="share">Share</button>
    <button class="btn" data-act="print">PDF / Print</button>
    <button class="btn" data-act="csv">Download CSV</button>
    <button class="btn danger" data-act="clear">Clear quote</button>
  </div>
  <div style="margin-top:18px">
    <div class="qfields">
      <div class="full"><label class="lbl" for="q-for">Prepared for</label><input type="text" id="q-for" value="${esc(state.quote.for)}" placeholder="Patient or company name" autocomplete="off"></div>
      <div><label class="lbl" for="q-ref">Reference</label><input type="text" id="q-ref" value="${esc(state.quote.ref)}" placeholder="${esc(autoRef())}"></div>
      <div><label class="lbl" for="q-vat">VAT %</label><input type="number" inputmode="decimal" id="q-vat" value="${esc(state.quote.vat)}"></div>
      <div class="full"><label class="lbl" for="q-notes">Notes on quote</label><textarea id="q-notes" placeholder="Scope, assumptions, payment terms…">${esc(state.quote.notes)}</textarea></div>
    </div>
    <div class="meta">Valid until ${fmtDate(validUntil())}. Type in a unit price to override it for this quote only.</div>
  </div>`;
}

function updateQuoteNumbers() {
  const q = computeQuote();
  q.lines.forEach(x => {
    const el = document.querySelector(`[data-ltot="${CSS.escape(x.l.code)}"]`); if (el) el.textContent = money(x.total);
    const src = document.querySelector(`[data-line="${CSS.escape(x.l.code)}"] .src`);
    if (src) { src.textContent = basis(x); src.hidden = !basis(x); src.classList.toggle("man", x.l.override != null); }
  });
  const s = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  s("#t-sub", money(q.sub)); s("#t-vp", q.vatPct); s("#t-vat", money(q.vat)); s("#t-tot", money(q.total));
  const poa = $("#t-poa"); if (poa) poa.hidden = !q.poa;
  const vr = $("#t-vrow"); if (vr) vr.hidden = !q.vatPct;
  $("#qcount").textContent = qCount() || "";
  renderSum();
}

function renderSum() {
  const el = $("#sum");
  const show = state.loaded && state.view === "list" && state.quote.lines.length > 0;
  el.hidden = !show; $("#main").classList.toggle("has-sum", show);
  if (!show) return;
  const q = computeQuote(), n = qCount();
  el.innerHTML = `<div class="sum-in"><div class="t"><small>${n} item${n === 1 ? "" : "s"} · ${q.vatPct ? "incl. VAT" : "total"}</small><b>${money(q.total)}</b></div><button data-go="quote">View quote</button></div>`;
}

/* ---------- quote outputs ---------- */
function quoteText() {
  const q = computeQuote(), ref = state.quote.ref || autoRef(), who = state.quote.for.trim();
  const L = [`Quote ${ref}${who ? " — " + who : ""}`, `${fmtDate(new Date())} · valid until ${fmtDate(validUntil())}`, ""];
  q.lines.forEach(x => L.push(`${x.l.qty} × ${x.p ? x.p.name : x.l.code} (${x.l.code}) @ ${money(x.unit)}${x.total == null ? "" : " = " + money(x.total)}`));
  L.push("", `Subtotal: ${money(q.sub)}`);
  if (q.vatPct) L.push(`VAT ${q.vatPct}%: ${money(q.vat)}`);
  L.push(`Total: ${money(q.total)}${q.poa ? " (excluding POA items)" : ""}`);
  if (state.quote.notes.trim()) L.push("", state.quote.notes.trim());
  L.push("", ...[CFG.companyName, CFG.contactName, CFG.phone && "Tel " + CFG.phone, CFG.instagram && "Instagram " + CFG.instagram].filter(Boolean));
  return L.join("\n");
}
async function shareQuote() {
  const text = quoteText();
  if (navigator.share) { try { await navigator.share({title: "Quote " + (state.quote.ref || autoRef()), text}); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); toast("Quote copied"); }
  catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast("Quote copied"); }
}
function downloadCSV() {
  const q = computeQuote(), ref = state.quote.ref || autoRef();
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Reference", "Prepared for", "Code", "Procedure", "Qty", "Unit price", "Line total", "Currency", "Note"]];
  q.lines.forEach(x => rows.push([ref, state.quote.for, x.l.code, x.p ? x.p.name : "", x.l.qty, x.unit ?? "POA", x.total ?? "", CFG.currency, basis(x)]));
  rows.push([], ["", "", "", "Subtotal", "", "", q.sub, CFG.currency], ["", "", "", `VAT ${q.vatPct}%`, "", "", q.vat, CFG.currency], ["", "", "", "Total", "", "", q.total, CFG.currency]);
  const blob = new Blob(["﻿" + rows.map(r => r.map(cell).join(",")).join("\r\n")], {type: "text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = ref + ".csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function buildPrint() {
  const q = computeQuote(), ref = state.quote.ref || autoRef(), who = state.quote.for.trim();
  if (!state.loaded || !q.lines.length) { $("#printArea").innerHTML = ""; return; }
  $("#printArea").innerHTML = `
    <div class="p-head"><div class="p-brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#1f7a4f"/><path d="M26 15h12v11h11v12H38v11H26V38H15V26h11z" fill="#fff"/></svg><div><div class="b1">${esc(CFG.title)}</div>${CFG.subtitle ? `<div class="b2">${esc(CFG.subtitle)}</div>` : ""}</div></div>
      <div class="p-meta">Ref <b>${esc(ref)}</b><br>Date ${fmtDate(new Date())}<br>Valid until ${fmtDate(validUntil())}</div></div>
    <h1 class="p-title">Quotation</h1>
    ${who ? `<div class="p-to">Prepared for <b>${esc(who)}</b></div>` : ""}
    <table><thead><tr><th>Code</th><th>Procedure</th><th class="n">Qty</th><th class="n">Unit price</th><th class="n">Total</th></tr></thead><tbody>
    ${q.lines.map(x => `<tr><td>${esc(x.l.code)}</td><td>${esc(x.p ? x.p.name : "")}${x.p && x.p.unit ? `<br><small>per ${esc(x.p.unit)}</small>` : ""}</td><td class="n">${x.l.qty}</td><td class="n">${money(x.unit)}</td><td class="n">${x.total == null ? "POA" : money(x.total)}</td></tr>`).join("")}
    </tbody></table>
    <div class="p-tot"><div><span>Subtotal</span><span>${money(q.sub)}</span></div>
    ${q.vatPct ? `<div><span>VAT ${q.vatPct}%</span><span>${money(q.vat)}</span></div>` : ""}
    <div class="g"><span>Total</span><span>${money(q.total)}</span></div></div>
    ${state.quote.notes.trim() ? `<div class="p-notes">${esc(state.quote.notes.trim())}</div>` : ""}
    <div class="p-foot">All prices in ${esc(CFG.currency)}.${q.poa ? " POA items are priced on application and not included in the total." : ""}<br>
      ${[CFG.companyName && `<b>${esc(CFG.companyName)}</b>`, esc(CFG.contactName), CFG.phone && "Tel " + esc(CFG.phone), CFG.instagram && "Instagram " + esc(CFG.instagram)].filter(Boolean).join(" · ")}</div>`;
}
function printQuote() { buildPrint(); setTimeout(() => window.print(), 50); }
window.addEventListener("beforeprint", buildPrint);

/* ---------- events ---------- */
function setView(v) { state.view = v; store.set("view", v); render(); window.scrollTo(0, 0); }
document.querySelector("nav.bottom").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) setView(b.dataset.view); });
$("#refresh").addEventListener("click", () => { if (!state.loading) load(); });
$("#search").addEventListener("input", e => { state.search = e.target.value; render(); });
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.cat = b.dataset.cat; document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-add],[data-inc],[data-dec],[data-rm],[data-act],[data-go]"); if (!t) return;
  const d = t.dataset, lines = state.quote.lines;
  if (d.add) { const l = lines.find(x => x.code === d.add); l ? l.qty++ : lines.push({code: d.add, qty: 1, override: null}); saveQuote(); buzz(); toast("Added to quote"); render(); }
  else if (d.inc || d.dec) { const l = lines.find(x => x.code === (d.inc || d.dec)); if (l) { l.qty = Math.max(1, l.qty + (d.inc ? 1 : -1)); saveQuote(); const i = document.querySelector(`[data-qty="${CSS.escape(l.code)}"]`); if (i) i.value = l.qty; updateQuoteNumbers(); } }
  else if (d.rm) { state.quote.lines = lines.filter(x => x.code !== d.rm); saveQuote(); render(); }
  else if (d.go) setView(d.go);
  else if (d.act === "share") shareQuote();
  else if (d.act === "print") printQuote();
  else if (d.act === "csv") downloadCSV();
  else if (d.act === "clear" && confirm("Clear this quote?")) { state.quote = {lines: [], vat: CFG.vatPct, notes: "", ref: "", for: ""}; saveQuote(); render(); }
});
$("#main").addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.qty) { const l = state.quote.lines.find(x => x.code === d.qty); const n = parseInt(t.value, 10); if (l && n > 0) l.qty = n; }
  else if (t.matches("[data-ov]")) { const l = state.quote.lines.find(x => x.code === d.ov); if (l) l.override = t.value === "" ? null : num(t.value); }
  else if (t.id === "q-vat") state.quote.vat = t.value;
  else if (t.id === "q-ref") state.quote.ref = t.value.trim();
  else if (t.id === "q-for") state.quote.for = t.value;
  else if (t.id === "q-notes") state.quote.notes = t.value;
  else return;
  saveQuote(); updateQuoteNumbers();
});
$("#main").addEventListener("change", e => {
  if (e.target.dataset.qty) { const l = state.quote.lines.find(x => x.code === e.target.dataset.qty); if (l) e.target.value = l.qty; }
});
// Reopened after 5+ minutes → refresh prices.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !state.loading && Date.now() - state.lastTry > 5 * 60e3) load();
});
window.addEventListener("online", () => { if (!state.loaded && !state.loading) load(); });

/* ---------- boot ---------- */
document.title = CFG.title; $("#brand").textContent = CFG.title;
$("#brand2").textContent = CFG.subtitle; $("#brand2").hidden = !CFG.subtitle;
if (CFG.sheetId) { const a = $("#openSheet"); a.href = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(CFG.sheetId)}/edit`; a.hidden = false; }
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
render(); load();
})();
</script>
</body>
</html>
